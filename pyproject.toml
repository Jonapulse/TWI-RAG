[project]
name = "wandering-inn-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jon Pulsipher", email = "jonapulse@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
wandering-inn-rag = "wandering_inn_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
